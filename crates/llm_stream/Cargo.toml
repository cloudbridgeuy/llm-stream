[package]
name = "llm-stream"
version = "0.5.1"
homepage = "https://github.com/cloudbridgeuy/llm-stream"
description = "Stream and interact with multiple LLMs providers from the terminal"
autobins = false

authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "llm-stream"
path = "src/main.rs"

[dependencies]
llm_stream = { version = "0.5.0", path = "../../lib/llm_stream" }
clap = { version = "4.5.16", features = ["derive", "string", "env"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
serde_yaml = "0.9.34"
env_logger = "0.11.5"
log = "0.4.22"
thiserror = "2"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread"] }
clap-stdin = "0.6"
futures = "0.3.30"
spinners = "4.1.1"
atty = "0.2.14"
crossterm = "0.29.0"
config-file = "0.2.3"
tera = "1.20.0"
toml = "0.9"
xid = "1.1.1"
cli-table = "0.5"
tempfile = "3.19.1"
syntect = { version = "5.2.0", default-features = false, features = [
  "default-fancy",
] }
nom = "7.1"
unicode-width = "0.2"
ureq = "2.10.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
